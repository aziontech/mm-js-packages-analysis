version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      azion-actions:
        patterns:
          - "aziontech/azion-action-*"
      github-actions:
        patterns:
          - "actions/*"
      third-party-actions:
        patterns:
          - "*"
        exclude-patterns:
          - "actions/*"
          - "aziontech/azion-action-*"

  - package-ecosystem: "npm"
    directories:
      - "/dato-cms-analysis/dato-cms-demo"
      - "/graphql-request-analysis/next-js-graphql-request-demo"
      - "/memory-cache-analysis/nextjs-memory-cache-demo"
      - "/next-auth-analysis/nextjs-next-auth-demo"
      - "/swr-analysis/nextjs-swr-demo"
      - "/winston-simple-logger-analysis/winston-and-simple-logger"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
